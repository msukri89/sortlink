<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SortLink</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f8fa;color:#172033}.box{text-align:center;padding:30px}.spin{width:28px;height:28px;border:3px solid #ddd;border-top-color:#172033;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spin"></div><div id="msg">Membuka tautan…</div></div><script src="config.js"></script><script>(async()=>{const base='/sortlink/';const path=location.pathname;let code=path.startsWith(base)?path.slice(base.length).split('/')[0]:'';if(!code){location.replace(base);return}if(!window.SORTLINK_API_URL){document.getElementById('msg').textContent='Mesin SortLink belum dikonfigurasi.';return}try{const r=await fetch(window.SORTLINK_API_URL+'?action=resolve&code='+encodeURIComponent(code));const d=await r.json();if(!d.ok)throw new Error(d.error||'Link tidak ditemukan.');location.replace(d.url)}catch(e){document.getElementById('msg').textContent=e.message||'Link tidak ditemukan.'}})();</script></body></html>
