<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SortLink</title>
<meta name="description" content="SortLink - layanan short link sederhana, cepat, dan ringan.">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8fb;color:#172033}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(680px,100%);background:#fff;border:1px solid #e5e9f0;border-radius:24px;padding:32px;box-shadow:0 12px 40px rgba(23,32,51,.08)}
.brand{font-size:32px;font-weight:800;letter-spacing:-.8px;margin-bottom:8px}
.sub{color:#667085;margin:0 0 28px}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;border:1px solid #d8dee9;border-radius:14px;padding:14px 16px;font-size:16px;outline:none}
button{border:0;border-radius:14px;padding:14px 20px;font-size:16px;font-weight:700;background:#172033;color:#fff;cursor:pointer}
.note{margin-top:18px;color:#98a2b3;font-size:13px;line-height:1.6}
@media(max-width:520px){.row{flex-direction:column}button{width:100%}}
</style>
</head>
<body>
<main class="wrap">
<section class="card">
<div class="brand">SortLink</div>
<p class="sub">Short link sederhana, cepat, dan ringan.</p>
<div class="row">
<input id="linkInput" type="url" placeholder="Tempel URL tujuan..." autocomplete="off">
<button id="createBtn" type="button">Buat Link</button>
</div>
<p class="note">Short link gratis berbasis GitHub Pages + Google Apps Script.</p>
</section>
</main>
<script>
document.getElementById('createBtn').addEventListener('click',()=>{
const value=document.getElementById('linkInput').value.trim();
if(!value){alert('Silakan masukkan URL tujuan.');return;}
alert('Mesin short link sedang disiapkan.');
});
</script>
</body>
</html>
